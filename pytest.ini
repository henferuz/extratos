[pytest]
testpaths = tests
# As varreduras completas das 176 planilhas de cartão (~10 min) ficam fora do
# `pytest -q` padrão; rode `pytest -m varredura` antes de cada entrega.
addopts = -m "not varredura"
markers =
    amostras: usa arquivos reais em samples/
    varredura: importa todas as amostras de uma pasta (lento; rodar com -m varredura antes de entregar)
